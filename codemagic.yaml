# Dva workflowy: ReCaption pro iPhone (iphone) a ReCaption pro Mac (mac-balicek), oba spouštět ručně.
#
# ReCaption pro iPhone na Codemagic – náhrada za .github/workflows/ios.yml, když GitHub nedá Mac
# (23. 11. 2026 úlohy na macOS hodiny ve frontě a pak zrušené). Dělá totéž co úloha „zkouska“ a „ipa“ v ios.yml:
# společná logika z Androidu (testy na macOS), knihovna pro PS5, testy aplikace, zkouška v simulátoru se „TV“
# a nepodepsaný ReCaption-iPhone.ipa (Sideloadly, 7 dní). Jak Codemagic zapnout: ios/CTI-ME.md#codemagic.
# Bezplatný plán: Mac mini M2, asi 500 minut měsíčně – proto se spouští jen ručně (Start new build),
# ne při každém pushi. TestFlight zatím jen přes GitHub (ios.yml), až bude účet Apple.
#
# ReCaption pro Mac přes Codemagic (od 23. 11. 2026, přání majitele) – záloha za .github/workflows/mac.yml:
# na GitHubu se v tomto repu žádná úloha na Macu nerozběhne (macos-15, macos-latest i macos-26 čekají 15 min a zruší se).
# Sestavení je totéž co úloha „balicek“ v mac.yml (Mac s Apple Silicon, balíček pro macOS 12 a novější) – při změně
# sestavení uprav obojí. Bezplatný plán (Mac mini M2, asi 500 minut měsíčně) – proto jako iPhone jen ručně
# (Start new build, workflow „ReCaption pro Mac“, větev podle potřeby), ne při každém pushi.
#
# Výsledek: ReCaption-Mac.dmg v artefaktech sestavení v Codemagicu. Když je v Codemagicu skupina proměnných „github“
# s GITHUB_TOKEN (token s právem Contents: Read and write k adusa89/ReCaption) a řádek „groups“ níž je odkomentovaný,
# nahraje se i do vydání „mac“ (z main) / „mac-zkusebni“ (z ostatních větví) – na „mac“ vede stránka pomoc/mac.md.
workflows:
  iphone:
    name: ReCaption pro iPhone
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      java: 17
      node: 22
    cache:
      cache_paths:
        - $HOME/.konan
        - $HOME/.gradle/caches
    scripts:
      - name: Knihovna pro PS5, společná logika a projekt pro Xcode
        script: ios/priprav.sh
      - name: Testy společné logiky (testy z Androidu na macOS)
        script: bash ./gradlew -p ios/jadro macosArm64Test --console=plain
      - name: Simulátor iPhonu
        script: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          d = json.load(sys.stdin)["devices"]
          def ver(k):
              m = re.search(r"iOS-(\d+)-(\d+)", k)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          for k in sorted(d, key=ver, reverse=True):
              phones = [x for x in d[k] if "iOS" in k and x["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break
          ')
          echo "Simulátor: $UDID"
          test -n "$UDID"
          echo "UDID=$UDID" >> "$CM_ENV"
      - name: Testy
        working_directory: ios
        script: |
          set -o pipefail
          xcodebuild test -project ReCaption.xcodeproj -scheme ReCaption \
            -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO | tail -n 40
      - name: Sestavení pro simulátor
        working_directory: ios
        script: |
          set -o pipefail
          xcodebuild build -project ReCaption.xcodeproj -scheme ReCaption -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tail -n 20
      - name: Zkouška se „TV“ – zkušební věta do TV
        working_directory: ios
        script: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/ReCaption.app
          xcrun simctl launch "$UDID" cz.recaption -zkouska
          node zkouska/tv.mjs ws://127.0.0.1:8787
          sleep 1
          mkdir -p snimky
          xcrun simctl io "$UDID" screenshot snimky/domu-pripojeno.png
      - name: Sestavení pro iPhone bez podpisu (ReCaption-iPhone.ipa)
        working_directory: ios
        script: |
          set -o pipefail
          CISLO=$(( ${BUILD_NUMBER:-1} + 5000 ))
          xcodebuild build -project ReCaption.xcodeproj -scheme ReCaption -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build-ios CURRENT_PROJECT_VERSION="$CISLO" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 20
          rm -rf Payload && mkdir Payload
          cp -R build-ios/Build/Products/Release-iphoneos/ReCaption.app Payload/
          zip -qry ReCaption-iPhone.ipa Payload
          ls -l ReCaption-iPhone.ipa
    artifacts:
      - ios/ReCaption-iPhone.ipa
      - ios/snimky/*.png

  mac-balicek:
    name: ReCaption pro Mac
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
      # groups:
      #   - github
      vars:
        PYTHONPYCACHEPREFIX: /tmp/recaption-pyc
        KNIHOVNY: >-
          ctranslate2 subword-nmt sacremoses rapidocr-onnxruntime>=1.3 pillow numpy
          pyobjc-framework-Quartz pyobjc-framework-ScreenCaptureKit
    scripts:
      - name: Nástroje (uv)
        script: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "PATH=$HOME/.local/bin:$PATH" >> "$CM_ENV"
          java -version

      - name: Sestavit ReCaption pro počítač
        script: bash ./gradlew -p pc installDist --console=plain

      - name: Aplikace ReCaption.app (Java uvnitř)
        script: |
          VERZE=$(sed -n 's/.*versionName = "\([0-9.]*\).*/\1/p' app/build.gradle.kts | head -1)
          echo "VERZE=$VERZE" >> "$CM_ENV"
          # macOS nedovolí číslo verze začínající nulou – jpackage dostane zbytek a celé číslo se doplní níž
          jpackage --type app-image --name ReCaption --dest out \
            --input pc/build/install/recaption-pc/lib --main-jar recaption-pc.jar --main-class cz.recaption.pc.AplikaceKt \
            --java-options '-Drecaption.pc=$APPDIR' --java-options '-Dfile.encoding=UTF-8' \
            --app-version "${VERZE#0.}" --vendor ReCaption --description "ReCaption pro Mac" \
            --mac-package-identifier cz.recaption.mac --mac-package-name ReCaption --icon pc/ReCaption.icns
          cp pc/cteni.py pc/priprava.sh out/ReCaption.app/Contents/app/
          chmod +x out/ReCaption.app/Contents/app/priprava.sh

      - name: Python s knihovnami pro čtení a překlad
        script: |
          uv python install 3.12 --install-dir "$PWD/pyt"
          PY=$(ls -d pyt/cpython-3.12*/ | head -1)
          CIL=out/ReCaption.app/Contents/app/python
          cp -R "$PY" "$CIL"
          rm -f "$CIL"/lib/python3.12/EXTERNALLY-MANAGED
          uv pip install --python "$CIL/bin/python3" --break-system-packages --only-binary=:all: $KNIHOVNY
          find "$CIL" -name __pycache__ -type d -prune -exec rm -rf {} +
          rm -rf "$CIL"/lib/python3.12/test "$CIL"/lib/python3.12/idlelib "$CIL"/share
          "$CIL/bin/python3" -c "import sys, platform; print(sys.version, platform.machine())"
          du -sh out/ReCaption.app

      - name: Údaje aplikace a podpis
        script: |
          PLIST=out/ReCaption.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERZE" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'ReCaption hledá v domácí síti PlayStation a televizi, které posílá překlad titulků.'" "$PLIST"
          # místní podpis („ad hoc“) – bez něj by aplikaci Mac s Apple Silicon nespustil
          codesign --force --deep --sign - out/ReCaption.app
          codesign --verify --verbose=2 out/ReCaption.app

      - name: Zkouška – části pro Mac (okna, nastavení chiaki-ng, Klíčenka, pruh)
        script: |
          JAVA_TOOL_OPTIONS="-Drecaption.prikaz=--zkouska-mac" out/ReCaption.app/Contents/MacOS/ReCaption
          defaults delete com.chiaki.Chiaki-recaption-zkouska || true

      - name: Zkouška – přibalený Python přečte a přeloží titulek
        script: |
          APP=out/ReCaption.app/Contents/app
          NASTROJE="$HOME/Library/Application Support/ReCaptionTools"
          bash "$APP/priprava.sh" cs "$NASTROJE" "$APP/python/bin/python3"
          MODEL=$(ls -d "$NASTROJE"/modely/en_cs/*/ | head -1)
          "$APP/python/bin/python3" pc/zkouska_balicku.py "$APP/python/bin/python3" "$APP/cteni.py" "${MODEL%/}"

      - name: Obraz disku ReCaption-Mac.dmg
        script: |
          # zkoušky do aplikace nic zapsat nesmějí – podpis musí pořád sedět
          codesign --verify --verbose=2 out/ReCaption.app
          mkdir dmg
          cp -R out/ReCaption.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "ReCaption" -srcfolder dmg -ov -format UDZO ReCaption-Mac.dmg
          hdiutil attach -nobrowse -readonly -mountpoint "$PWD/bod" ReCaption-Mac.dmg
          codesign --verify --verbose=2 bod/ReCaption.app
          hdiutil detach "$PWD/bod"
          ls -la ReCaption-Mac.dmg

      - name: Vydání „mac“ (z main) / „mac-zkusebni“ (z větve)
        script: |
          if [ -z "${GITHUB_TOKEN:-}" ]; then echo "GITHUB_TOKEN chybí – balíček je jen v artefaktech Codemagicu"; exit 0; fi
          command -v gh >/dev/null || brew install gh
          export GH_TOKEN="$GITHUB_TOKEN" GH_REPO=adusa89/ReCaption
          if [ "$CM_BRANCH" = "main" ]; then ZNACKA=mac; NAZEV="ReCaption pro Mac (zkušební) $VERZE"
          else ZNACKA=mac-zkusebni; NAZEV="ReCaption pro Mac – zkušební z větve $CM_BRANCH ($VERZE)"; fi
          gh release delete "$ZNACKA" --yes --cleanup-tag || true
          gh release create "$ZNACKA" ReCaption-Mac.dmg --target "$CM_COMMIT" --prerelease --latest=false \
            --title "$NAZEV" \
            --notes "ReCaption pro Mac s Apple Silicon (M1 a novější, macOS 12 a novější), zkušební. Otevřít ReCaption-Mac.dmg a přetáhnout ReCaption do Aplikací. Aplikace není podepsaná u Applu – první otevření povolit v Nastavení systému → Soukromí a zabezpečení → Přesto otevřít. Návod: https://recaption.pages.dev/mac.html. Spojení s PlayStationem obstarává program chiaki-ng (AGPL-3.0), který si ReCaption stáhne samo; zdrojový kód je v tomto repozitáři. Sestaveno v Codemagicu."
    artifacts:
      - ReCaption-Mac.dmg
