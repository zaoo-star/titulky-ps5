<!doctype html>
<!-- Průvodce nastavením na webu – STEJNÉ hlavní kroky jako průvodce v aplikaci, přání majitele 23. 11. 2026. Web nic nenastavuje – čte
     se na PC nebo v telefonu a kroky se dělají v aplikaci (u každého podkroku je, kde: 📱 telefon / 📺 TV / 🎮 PS5).
     Od 24. 11. 2026 jedna šablona pro web i aplikaci: kroky, podkroky, texty, klipy a podmínky jsou v app/src/main/java/cz/recaption/core/Pruvodce.kt,
     odtud vygenerované do pruvodce-data.js (gradlew -p ci/mistni-kontrola test -Ppruvodce; test PruvodceTest hlídá soulad).
     Tahle stránka jen vykresluje – texty kroků sem nepatří. Video u podkroku: id → videa/<id>-<cs|en>.mp4, délky z videa/kroky.json.
     Jazyk: cs / en (?lang=…, localStorage recaption_lang, jinak jazyk prohlížeče – cs a sk = čeština). -->
<html lang="cs">
<head>
<meta charset="utf-8">
<link rel="icon" href="obrazky/ikona.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Průvodce nastavením · ReCaption</title>
<meta name="description" content="Průvodce nastavením ReCaptionu krok za krokem – Android TV, LG, Samsung, PlayStation 5.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--bg2:#151923;--karta:#1a1f2b;--cara:#2a3142;--text:#eef1f6;--slaby:#9aa3b5;--zluta:#f2c14e;--zluta2:#ffd979;--zelena:#4cd08a;--modra:#5ab0ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--zluta)}
.lista{position:sticky;top:0;z-index:10;background:rgba(13,15,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--cara)}
.lista .obal{display:flex;align-items:center;gap:18px;height:58px;max-width:1180px;margin:0 auto;padding:0 20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--text);text-decoration:none}
.logo img{width:32px;height:32px;display:block}
.lista nav{margin-left:auto;display:flex;gap:16px;align-items:center}
.lista nav a{color:var(--slaby);text-decoration:none;font-weight:500;font-size:15px}
.lista nav a:hover{color:var(--text)}
.lista nav a.kafe{color:var(--zluta);white-space:nowrap}
.lista nav a.fb{color:#1877F2;display:inline-flex;align-items:center}
.lista nav a.fb:hover{color:#4a95f5}
.lista nav .tl{background:var(--zluta);color:#1a1300;padding:7px 14px;border-radius:10px;font-weight:600}
.jazyk{color:var(--slaby);font-weight:600;font-size:14px;white-space:nowrap;border:1px solid var(--cara);border-radius:8px;padding:4px 8px}
.jazyk a{font-size:14px!important;cursor:pointer}
.jazyk a.on{color:var(--text)!important}
@media (max-width:640px){.lista nav > a:not(.tl):not(.kafe){display:none}}
@media (max-width:440px){.lista .obal{gap:10px;padding:0 12px}.lista nav{gap:10px}.lista nav .kt{display:none}.logo{font-size:16px}}

.obsah{max-width:1180px;margin:0 auto;padding:20px 20px 0;display:grid;grid-template-columns:280px 1fr;gap:28px}
@media (max-width:860px){.obsah{grid-template-columns:1fr;padding:0 16px}.bok{display:none}}

/* levý seznam kroků jako v aplikaci na TV */
.bok{position:sticky;top:82px;align-self:start}
.bok h2{font-size:14px;color:var(--slaby);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 12px}
.bok ol{list-style:none;margin:0;padding:0}
.bok li{margin:0 0 4px}
.bok button{width:100%;text-align:left;font:inherit;color:var(--slaby);background:none;border:0;border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;gap:10px;align-items:center}
.bok button:hover{background:var(--karta);color:var(--text)}
.bok button .c{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:50%;border:1px solid var(--cara);font-size:13px;font-weight:700}
.bok button.hotovy .c{background:rgba(76,208,138,.15);border-color:transparent;color:var(--zelena)}
.bok button.ted{background:var(--karta);color:var(--text);font-weight:600}
.bok button.ted .c{background:var(--zluta);border-color:var(--zluta);color:#1a1300}
.bok .pod{list-style:none;margin:2px 0 8px 36px;padding:0;font-size:14px}
.bok .pod button{padding:3px 10px;font-size:14px}
.bok .pod button.ted{background:none;color:var(--zluta)}
.bok .pod button.hotovy{color:#7f889a}

/* postup: text + výrazná lišta (vidět i v kroku 0 a na telefonu – přilepená pod horní lištou) */
.postup{position:sticky;top:58px;z-index:5;background:var(--bg);padding:12px 0;margin:0 0 10px;border-bottom:1px solid var(--cara)}
.postup .radek{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 14px;font-size:15px;color:var(--slaby);margin:0 0 8px}
.postup .radek b{color:var(--text);font-size:16px}
.postup .radek .pk{color:var(--zluta);font-weight:600}
.lista-postupu{display:flex;gap:5px}
.lista-postupu i{position:relative;flex:1;height:12px;border-radius:6px;background:#262d3d;overflow:hidden}
.lista-postupu i.nula{flex:.45}
.lista-postupu i b{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--zluta),var(--zluta2));border-radius:6px;transition:width .25s}
.tecky{display:none;gap:6px;margin:10px 0 0;flex-wrap:wrap}
.tecky button{width:30px;height:30px;border-radius:50%;border:1px solid var(--cara);background:var(--karta);color:var(--slaby);font:700 13px Inter,system-ui,sans-serif;cursor:pointer;padding:0}
.tecky button.hotovy{color:var(--zelena);border-color:transparent;background:rgba(76,208,138,.15)}
.tecky button.ted{background:var(--zluta);border-color:var(--zluta);color:#1a1300}
@media (max-width:860px){.tecky{display:flex}}

h1{font-size:clamp(24px,3.4vw,34px);line-height:1.15;letter-spacing:-.015em;margin:8px 0 4px;font-weight:800}
.podtitul{color:var(--slaby);margin:0 0 16px;font-size:15px}
.kde{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:#263045;color:#cfd8ea;margin:0 6px 10px 0}
.panel{background:var(--karta);border:1px solid var(--cara);border-radius:18px;padding:22px}
@media (max-width:560px){.panel{padding:16px}}
.panel p,.panel li{color:#d5dae4}
.panel ol,.panel ul{padding-left:1.3em;margin:8px 0}
.panel li{margin:6px 0}
.panel .pozn{color:var(--slaby);font-size:14px}
/* QR jen v počítači: odkaz, který se otevírá v telefonu – naskenovat místo opisování (v telefonu stačí klepnout) */
.qr{float:right;margin:0 0 10px 16px;text-align:center;font-size:12px;color:var(--slaby)}
.qr img{display:block;width:132px;height:132px;border-radius:8px}
@media (max-width:760px),(hover:none){.qr{display:none}}
.video{margin:16px 0 4px;border-radius:14px;overflow:hidden;border:1px solid var(--cara);background:#000;max-width:720px}
.video video{display:block;width:100%;aspect-ratio:16/9;background:#000}
.video .pod-video{display:flex;justify-content:space-between;padding:8px 12px;font-size:13px;color:var(--slaby);background:var(--bg2)}

/* volby (krok 0) */
.volby{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0 14px}
.volby button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;font:inherit;color:var(--text);background:var(--bg2);border:2px solid var(--cara);border-radius:14px;padding:14px;cursor:pointer}
.volby button:hover{border-color:#4a5468}
.volby button.on{border-color:var(--zluta);background:#221f17}
.volby button b{font-size:16px}
.volby button small{color:var(--slaby);font-size:13px;line-height:1.35}
.volby button[disabled]{opacity:.4;cursor:not-allowed}

/* Zpět / Pokračovat – přilepené dole, vidět i pod dlouhým obsahem */
.otazka{font-size:17px;margin:18px 0 8px}
.otazka:first-child{margin-top:0}
.tlacitka{display:flex;gap:10px;justify-content:space-between;margin:10px 0 0}
.tlacitka .tl{padding:9px 18px;font-size:15px}
.tl{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:12px;font:600 16px Inter,system-ui,sans-serif;text-decoration:none;cursor:pointer;border:1px solid var(--cara)}
.tl.hlavni{background:var(--zluta);border-color:var(--zluta);color:#1a1300;margin-left:auto}
.tl.hlavni:hover{background:var(--zluta2)}
.tl.dalsi{background:var(--karta);color:var(--text)}
.tl[hidden]{display:none}
@media (max-width:560px){.tl{padding:13px 16px}.tl.hlavni{flex:1}}
.stahnout{display:inline-flex;align-items:center;gap:8px;margin:2px 4px 2px 0;padding:8px 14px;border-radius:10px;background:var(--zluta);color:#1a1300!important;font-weight:600;text-decoration:none}
.kod{font:800 22px/1 Inter,sans-serif;letter-spacing:.08em;color:var(--zluta)}
/* přehled „Co je potřeba“ před krokem 0: zařízení pod sebou, sloupce podle TV (na telefonu jeden sloupec) */
.prehled{display:grid;grid-template-columns:130px 1fr 1fr;gap:10px}
.prehled .ph-sl{font-weight:800;font-size:17px;padding:4px 14px;color:var(--zluta)}
.prehled .ph-zar{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;background:var(--bg2);border:1px solid var(--cara);border-radius:14px;padding:14px 10px;font-weight:600}
.prehled .ph-zar svg{width:64px;height:48px;color:#cfd8ea}
.prehled .ph-b{background:var(--bg2);border:1px solid var(--cara);border-radius:14px;padding:12px 14px}
.prehled ul{list-style:none;margin:0;padding:0}
.prehled li{margin:4px 0;padding-left:22px;position:relative;font-size:15px;line-height:1.45}
.prehled li:before{content:"✔";position:absolute;left:0;color:var(--zelena)}
.prehled li.nep{color:var(--slaby)}
.prehled li.nep:before{content:"○";color:var(--slaby)}
.prehled li .np{font-size:12px;font-weight:600;border:1px solid var(--cara);border-radius:99px;padding:0 7px;margin-left:6px;white-space:nowrap}
.prehled .ph-nic{color:var(--slaby)}
.prehled .ph-vse{grid-column:span 2}
@media (max-width:760px){.prehled{grid-template-columns:1fr;gap:8px}.prehled .ph-sl,.prehled .ph-roh{display:none}
  .prehled .ph-zar{flex-direction:row;justify-content:flex-start;margin-top:10px;padding:10px 14px}.prehled .ph-zar svg{width:44px;height:34px}
  .prehled .ph-vse{grid-column:auto}.prehled .ph-b[data-s]:before{content:attr(data-s);display:block;font-size:13px;font-weight:700;color:var(--slaby);margin:0 0 4px}}
.pata{max-width:1180px;margin:0 auto;padding:24px 20px 40px;color:var(--slaby);font-size:13px}
</style>
</head>
<body>
<header class="lista">
  <div class="obal">
    <a class="logo" href="./"><img src="obrazky/ikona.svg" alt="">ReCaption</a>
    <nav>
      <a href="./#jak" data-t="nav_jak">Jak to funguje</a>
      <a href="pruvodce.html" data-t="nav_pruvodce">Průvodce</a>
      <span class="jazyk"><a data-lang="cs" lang="cs">CZ</a> · <a data-lang="en" lang="en">EN</a></span>
      <a class="fb" href="https://www.facebook.com/ReCaptionTV" target="_blank" rel="noopener" title="Facebook" aria-label="ReCaption na Facebooku"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="vertical-align:-4px"><path fill="currentColor" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.88v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/></svg></a>
      <a class="kafe" href="podporit.html">☕<span class="kt" data-t="nav_kafe"> Podpořit</span></a>
      <a class="tl" href="https://recaption.pages.dev/stahnout" data-t="nav_stahnout">Stáhnout</a>
    </nav>
  </div>
</header>

<div class="obsah">
  <aside class="bok"><h2 data-t="bok">Kroky jako v aplikaci</h2><ol id="bok"></ol></aside>
  <main>
    <div class="postup">
      <div class="radek"><b id="postup-krok"></b><span class="pk" id="postup-pod"></span></div>
      <div class="lista-postupu" id="lista"></div>
      <div class="tecky" id="tecky"></div>
      <div class="tlacitka">
        <button class="tl dalsi" id="zpet"></button>
        <button class="tl hlavni" id="dal"></button>
      </div>
    </div>
    <h1 id="nadpis"></h1>
    <p class="podtitul" id="podtitul"></p>
    <div class="panel" id="panel"></div>
  </main>
</div>
<div class="pata" data-t="pata">Aplikace není produktem společnosti Sony Interactive Entertainment ani Microsoftu.</div>

<script src="pruvodce-data.js"></script>
<script>
// Vykreslovač průvodce: kroky, podkroky, texty, klipy a podmínky jsou v datech window.PRUVODCE (pruvodce-data.js), která
// se generují ze šablony app/src/main/java/cz/recaption/core/Pruvodce.kt. Tady žádné texty kroků nepiš – patří do šablony.
(function () {
  var D = window.PRUVODCE;
  // ---- jazyk: ?lang=cs|en > uložená volba > jazyk prohlížeče (cs, sk → čeština) ----
  var KLIC = 'recaption_lang';
  function zjisti() {
    var m = /[?&]lang=(cs|en)(&|$)/.exec(location.search);
    if (m) { try { localStorage.setItem(KLIC, m[1]); } catch (e) {} return m[1]; }
    try { var s = localStorage.getItem(KLIC); if (s === 'cs' || s === 'en') return s; } catch (e) {}
    var n = (navigator.languages && navigator.languages[0]) || navigator.language || '';
    return /^(cs|sk)/i.test(n) ? 'cs' : 'en';
  }
  var J = zjisti();
  function L(cs, en) { return J === 'en' ? en : cs; }
  function U(k) { var x = D.ui[k]; return L(x.cs, x.en); }

  // návody v Markdownu mají anglickou dvojici v en/ (stejný název souboru)
  var NAVODY = /^(android-tv|deepl|lg|mac|pc|podporit|ps5|samsung|telefon|xbox|zacit|zkratka)\.html/;
  function odkazy(koren) {
    var a = koren.querySelectorAll('a[href]');
    for (var i = 0; i < a.length; i++) {
      var h0 = a[i].getAttribute('data-h0');
      if (h0 === null) { h0 = a[i].getAttribute('href'); a[i].setAttribute('data-h0', h0); }
      if (NAVODY.test(h0)) a[i].setAttribute('href', (J === 'en' ? 'en/' : '') + h0);
    }
  }
  function jazykStranky() {
    document.documentElement.lang = J;
    document.title = U('title');
    var md = document.querySelector('meta[name=description]');
    if (md) md.setAttribute('content', U('desc'));
    var t = document.querySelectorAll('[data-t]');
    for (var i = 0; i < t.length; i++) { var x = D.ui[t[i].getAttribute('data-t')]; if (x) t[i].textContent = L(x.cs, x.en); }
    var j = document.querySelectorAll('.jazyk a');
    for (var k = 0; k < j.length; k++) j[k].className = j[k].getAttribute('data-lang') === J ? 'on' : '';
    odkazy(document.querySelector('.lista'));
  }

  // ---- stav: volby z kroku 0, hlavní krok k a podkrok p (v adrese #tv=atv&in=downloader&na=jine&k=3&p=1) ----
  // tv = jaká TV, na = čím se Android TV nastavuje (telefon = pomocník v telefonu / ovladac / jine = web v prohlížeči;
  // u LG a Samsungu vždy telefon), ko = konzole, dl = DeepL, in = jak se ReCaption dostane do Android TV.
  // k = -1: přehled „Co je potřeba“ před krokem 0 (stránka bez kroku v adrese začíná jím)
  var st = { tv: 'atv', na: 'telefon', ko: 'ps5', dl: 'ne', in: 'telefon', k: -1, p: 0 };
  var DELKY = {}, JENCS = [];   // JENCS: klipy zatím jen česky (kroky.json „jen_cs“) – česky pro všechny jazyky
  function tvJmeno() { return U('tv_' + st.tv); }
  function znacka() { return st.tv === 'lg' ? 'LG' : 'Samsung'; }
  // výchozí cesta do Android TV podle pomocníka: s aplikací v telefonu z telefonu, jinak Downloader
  function vychoziIn() { return st.na === 'telefon' ? 'telefon' : 'downloader'; }
  function normal() { if (st.tv !== 'atv') st.na = 'telefon'; }

  // podmínka ze šablony (Pruvodce.Kdy): každé pole musí sedět; klip = jen když podkrok má klip
  var POLE = ['tv', 'na', 'ko', 'dl', 'in'];
  function plati(c, maKlip) {
    if (!c) return true;
    for (var i = 0; i < POLE.length; i++) if (c[POLE[i]] && c[POLE[i]].indexOf(st[POLE[i]]) < 0) return false;
    if (c.beh && c.beh.indexOf('web') < 0) return false;
    if (c.klip && !maKlip) return false;
    return true;
  }
  function dosad(t) { return t.replace(/\{tv\}/g, tvJmeno()).replace(/\{znacka\}/g, znacka()); }
  // text = varianty [{kdy, cs, en}] – první platná
  function tx(v, maKlip) {
    for (var i = 0; i < v.length; i++) if (plati(v[i].kdy, maKlip)) return dosad(L(v[i].cs, v[i].en));
    return '';
  }

  // Klipy (stejné pravidlo jako VideoSteps v aplikaci): id `krok-<krok>[-<podkrok>][-<tv>][-<konzole>]`, tv = android / lg /
  // samsung, konzole = ps / xbox. Od nejpřesnějšího: -tv-konzole, -tv, -konzole, bez přípony; bere se jen id ze seznamu
  // videa/kroky.json (DELKY). Kroky s konzolí v obraze (konzole, připojení, hotovo): id bez -xbox ukazuje PS5, s Xboxem
  // se berou jen id končící -xbox.
  function klip(krok, pod) {
    var tv = st.tv === 'atv' ? 'android' : st.tv, ko = st.ko === 'xbox' ? 'xbox' : 'ps';
    var z = 'krok-' + krok + (pod ? '-' + pod : '');
    var kandidati = [z + '-' + tv + '-' + ko, z + '-' + tv, z + '-' + ko, z];
    for (var i = 0; i < kandidati.length; i++) {
      var id = kandidati[i];
      if (ko === 'xbox' && /^(konzole|pripojeni|hotovo)$/.test(krok) && !/-xbox$/.test(id)) continue;
      if (DELKY[id]) return id;
    }
    return null;
  }
  function video(id, popis) {
    if (!id || !DELKY[id]) return '';
    var j = J === 'en' && JENCS.indexOf(id) < 0 ? 'en' : 'cs';
    return '<div class="video"><video controls playsinline preload="none" poster="videa/' + id + '-' + j + '.jpg" src="videa/' + id + '-' + j + '.mp4"></video>' +
      '<div class="pod-video"><span>▶ ' + popis + '</span><span>' + (DELKY[id] || '') + '</span></div></div>';
  }
  function kde(t) { return t ? '<span class="kde">' + t + '</span>' : ''; }
  function seznam(znacka, polozky) {
    var x = [];
    for (var i = 0; i < polozky.length; i++) if (plati(polozky[i].kdy)) x.push(dosad(L(polozky[i].cs, polozky[i].en)));
    return '<' + znacka + '><li>' + x.join('</li><li>') + '</li></' + znacka + '>';
  }
  // QR kód odkazu pro telefon (obrázky z ci/qr-web.py); v telefonu skrytý
  function QR(jmeno) { return '<figure class="qr"><img src="obrazky/qr-' + jmeno + '.svg" alt="QR"><figcaption>' + U('qr') + '</figcaption></figure>'; }
  function volby(b) {
    var h = '<div class="volby" id="' + b.id + '">';
    for (var i = 0; i < b.moznosti.length; i++) {
      var m = b.moznosti[i];
      h += '<button data-v="' + m.v + '"' + (m.vypnuto && plati(m.vypnuto) ? ' disabled' : '') + '><b>' + tx(m.n) + '</b><small>' + tx(m.d) + '</small></button>';
    }
    return h + '</div>';
  }
  // obsah podkroku z bloků šablony
  function bloky(d, maKlip) {
    var h = '', otazka = 0;
    for (var i = 0; i < d.bloky.length; i++) {
      var b = d.bloky[i];
      if (!plati(b.kdy, maKlip)) continue;
      if (b.t === 'p') h += '<p>' + tx(b.x, maKlip) + '</p>';
      else if (b.t === 'pozn') h += '<p class="pozn">' + tx(b.x, maKlip) + '</p>';
      else if (b.t === 'dal') h += '<p><b>➜ ' + tx(b.x, maKlip) + '</b></p>';   // od tady vede aplikace, web je pro kontrolu
      else if (b.t === 'ol' || b.t === 'ul') h += seznam(b.t, b.polozky);
      else if (b.t === 'qr') h += QR(tx(b.x));
      else if (b.t === 'otazka') h += '<h3 class="otazka">' + (++otazka) + '. ' + tx(b.x) + '</h3>';
      else if (b.t === 'volby') h += volby(b);
    }
    return h;
  }
  function podkrok(krok, d) {
    var s = { n: tx(d.n), kde: d.kde ? tx(d.kde) : '' };
    s.klip = d.klip && plati(d.klip.kdy) ? klip(krok.id, d.klip.pod) : null;
    s.html = function () { return bloky(d, !!s.klip); };
    return s;
  }

  // ---- přehled „Co je potřeba“ (data D.prehled ze šablony) ----
  var IKONY = {
    tv: '<svg viewBox="0 0 64 48" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="56" height="34" rx="2"/><path d="M28 37v5M20 44h24"/></svg>',
    konzole: '<svg viewBox="0 0 64 48" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 22l12-12h40v16L46 38H6z"/><path d="M6 22h40v16M46 22l12-12"/><path d="M12 30h18"/></svg>',
    telefon: '<svg viewBox="0 0 64 48" fill="none" stroke="currentColor" stroke-width="2"><rect x="22" y="2" width="20" height="44" rx="3"/><path d="M29 41h6"/></svg>',
    sit: '<svg viewBox="0 0 64 48" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 20a26 26 0 0 1 36 0M20 27a17 17 0 0 1 24 0M26 34a8 8 0 0 1 12 0"/><circle cx="32" cy="40" r="2"/></svg>',
    deepl: '<svg viewBox="0 0 64 48" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 8h28v20H24l-8 7v-7h-6z"/><path d="M42 18h12v18h-5v6l-7-6H30v-4"/></svg>'
  };
  function kresliPrehled() {
    var P = D.prehled;
    var h = '<div class="prehled"><div class="ph-roh"></div>';
    for (var c = 0; c < P.sloupce.length; c++) h += '<div class="ph-sl">' + L(P.sloupce[c].cs, P.sloupce[c].en) + '</div>';
    for (var r = 0; r < P.radky.length; r++) {
      var rd = P.radky[r];
      h += '<div class="ph-zar">' + (IKONY[rd.ikona] || '') + '<span>' + L(rd.n.cs, rd.n.en) + '</span></div>';
      // stejné ve všech sloupcích → jedna buňka přes celou šířku (na telefonu se neopakuje)
      var stejne = true;
      for (var x = 1; x < rd.bunky.length; x++) if (JSON.stringify(rd.bunky[x]) !== JSON.stringify(rd.bunky[0])) stejne = false;
      for (var b = 0; b < (stejne ? 1 : rd.bunky.length); b++) {
        var pol = rd.bunky[b], li = '';
        for (var i = 0; i < pol.length; i++) li += '<li' + (pol[i].nep ? ' class="nep"' : '') + '>' + L(pol[i].cs, pol[i].en) +
          (pol[i].nep && i === 0 ? '<span class="np">' + U('nepovinne') + '</span>' : '') + '</li>';
        h += (stejne ? '<div class="ph-b ph-vse">' : '<div class="ph-b" data-s="' + L(P.sloupce[b].cs, P.sloupce[b].en) + '">') + (li ? '<ul>' + li + '</ul>' : '<span class="ph-nic">—</span>') + '</div>';
      }
    }
    return h + '</div>';
  }
  function polozkaPrehledu() {
    return '<li><button data-k="-1" class="' + (st.k < 0 ? 'ted' : 'hotovy') + '"><span class="c">' + U('prehled_bok') + '</span>' + U('prehled') + '</button></li>';
  }
  function teckaPrehledu() { return '<button data-k="-1" title="' + U('prehled') + '" class="' + (st.k < 0 ? 'ted' : 'hotovy') + '">' + U('prehled_bok') + '</button>'; }
  function klikKroky() {
    var bb = document.querySelectorAll('#bok button, #tecky button');
    for (var n = 0; n < bb.length; n++) bb[n].onclick = function () { st.k = +this.getAttribute('data-k'); st.p = +(this.getAttribute('data-p') || 0); uloz(); kresli(); nahoru(); };
  }
  // obrazovka před krokem 0: přehled „Co je potřeba“ (Začít → 0.1)
  function kresliUvod() {
    document.getElementById('postup-krok').textContent = U('prehled_krok');
    document.getElementById('postup-pod').textContent = U('prehled');
    var d = '';
    for (var i = 0; i <= CELKEM; i++) d += '<i' + (i === 0 ? ' class="nula"' : '') + '><b style="width:0%"></b></i>';
    document.getElementById('lista').innerHTML = d;
    var te = teckaPrehledu(), seznamKroku = polozkaPrehledu();
    for (var q = 0; q < KROKY.length; q++) {
      if (q !== 0 && q !== POSL && skryta(q)) continue;
      var cis = q === POSL ? '✓' : (q === 0 ? '0' : poradi(q));
      te += '<button data-k="' + q + '" title="' + nazevKroku(q) + '" class="">' + cis + '</button>';
      seznamKroku += '<li><button data-k="' + q + '" class=""><span class="c">' + cis + '</span>' + nazevKroku(q) + '</button></li>';
    }
    document.getElementById('tecky').innerHTML = te;
    document.getElementById('bok').innerHTML = seznamKroku;
    document.getElementById('nadpis').innerHTML = U('prehled');
    document.getElementById('podtitul').textContent = U('prehled_uvod');
    var panel = document.getElementById('panel');
    panel.innerHTML = kresliPrehled();
    odkazy(panel);
    document.getElementById('zpet').hidden = true;
    document.getElementById('zpet').textContent = U('zpet');
    document.getElementById('dal').textContent = U('zacit');
    klikKroky();
  }

  // ---- vykreslení ----
  var KROKY = D.kroky;
  var POSL = KROKY.length - 1;
  // krok, jehož podmínka pro tyhle volby neplatí (Zobrazení titulků u LG / Samsungu, Připojení u Xboxu), se přeskočí
  // a „Krok X z N“ se tím zmenší (přání majitele)
  function skryta(k) { return !plati(KROKY[k].kdy); }
  var CELKEM = 0, VID = [];
  var PODY = [];
  function sestav() {
    PODY = [];
    for (var i = 0; i < KROKY.length; i++) {
      var p = [];
      for (var j = 0; j < KROKY[i].pod.length; j++) if (plati(KROKY[i].pod[j].kdy)) p.push(podkrok(KROKY[i], KROKY[i].pod[j]));
      PODY.push(p);
    }
    if (st.k >= 0 && st.p >= PODY[st.k].length) st.p = PODY[st.k].length - 1;
    VID = [];
    for (var g = 1; g < POSL; g++) if (!skryta(g)) VID.push(g);
    CELKEM = VID.length;
  }
  function poradi(k) { var i = VID.indexOf(k); return i < 0 ? 0 : i + 1; } // pozice skupiny mezi viditelnými (1-based)
  function nazevKroku(k) { return L(KROKY[k].n.cs, KROKY[k].n.en); }
  function kresli() {
    sestav();
    if (st.k < 0) { kresliUvod(); return; }
    var pody = PODY[st.k], s = pody[st.p];
    // postup: text + lišta (hlavní krok; aktuální díl plný podle podkroků) + podkrok
    var pozice = st.k === 0 ? 0 : poradi(st.k); // pozice mezi viditelnými skupinami (skryté se do čísla nepočítají)
    document.getElementById('postup-krok').textContent = st.k === POSL ? U('hotovo') + ' · ' + CELKEM + ' / ' + CELKEM
      : U('krok') + pozice + U('z') + CELKEM + ' · ' + nazevKroku(st.k);
    document.getElementById('postup-pod').textContent = U('podkrok') + (st.p + 1) + '/' + pody.length + ' · ' + s.n;
    var d = '';
    for (var i = 0; i <= CELKEM; i++) { // díl 0 (Začínáme) je užší, ať se lišta plní už od začátku
      var w = st.k === POSL || i < pozice ? 100 : (i === pozice ? Math.round((st.p + 1) / pody.length * 100) : 0);
      d += '<i' + (i === 0 ? ' class="nula"' : '') + '><b style="width:' + w + '%"></b></i>';
    }
    document.getElementById('lista').innerHTML = d;
    var te = '';
    for (var q = 0; q < KROKY.length; q++) {
      if (q !== 0 && q !== POSL && skryta(q)) continue;
      te += '<button data-k="' + q + '" title="' + nazevKroku(q) + '" class="' + (q === st.k ? 'ted' : (q < st.k ? 'hotovy' : '')) + '">' + (q === POSL ? '✓' : (q === 0 ? '0' : poradi(q))) + '</button>';
    }
    document.getElementById('tecky').innerHTML = teckaPrehledu() + te;

    document.getElementById('nadpis').innerHTML = (pody.length > 1 ? '<span style="color:var(--zluta)">' + pozice + '.' + (st.p + 1) + '</span> ' : '') + s.n;
    document.getElementById('podtitul').textContent = st.k === 0 && st.p === 0 ? U('uvod') : nazevKroku(st.k);
    var panel = document.getElementById('panel');
    panel.innerHTML = kde(s.kde) + s.html() + (s.klip ? video(s.klip, nazevKroku(st.k) + ' · ' + s.n) : '');
    odkazy(panel);

    var zpet = document.getElementById('zpet');
    zpet.hidden = false;   // z 0.1 zpět na přehled
    zpet.textContent = U('zpet');
    var konec = st.k === POSL && st.p === pody.length - 1;
    document.getElementById('dal').textContent = konec ? U('dokoncit')
      : (st.k === POSL - 1 && st.p === pody.length - 1 ? U('na_hotovo') : U('dal'));

    // volby (bloky „volby“ v šabloně: id prvku → klíč stavu)
    for (var vk = 0; vk < KROKY.length; vk++) for (var vp = 0; vp < KROKY[vk].pod.length; vp++) {
      var bl = KROKY[vk].pod[vp].bloky;
      for (var vb = 0; vb < bl.length; vb++) if (bl[vb].t === 'volby') navaz(bl[vb].id, bl[vb].klic);
    }
    // levý seznam: hlavní kroky, u aktuálního jeho podkroky (skryté skupiny se v seznamu neukazují)
    var seznamKroku = polozkaPrehledu();
    for (var k = 0; k < KROKY.length; k++) {
      if (k !== 0 && k !== POSL && skryta(k)) continue;
      var cis = k === 0 ? '0' : (k === POSL ? '✓' : poradi(k));
      seznamKroku += '<li><button data-k="' + k + '" class="' + (k === st.k ? 'ted' : (k < st.k ? 'hotovy' : '')) + '"><span class="c">' + (k < st.k && k > 0 ? '✓' : cis) + '</span>' + nazevKroku(k) + '</button>';
      if (k === st.k && PODY[k].length > 1) {
        seznamKroku += '<ul class="pod">';
        for (var m = 0; m < PODY[k].length; m++) seznamKroku += '<li><button data-k="' + k + '" data-p="' + m + '" class="' + (m === st.p ? 'ted' : (m < st.p ? 'hotovy' : '')) + '">' + (m < st.p ? '✓ ' : '') + PODY[k][m].n + '</button></li>';
        seznamKroku += '</ul>';
      }
      seznamKroku += '</li>';
    }
    document.getElementById('bok').innerHTML = seznamKroku;
    klikKroky();
  }
  function navaz(id, klic) {
    var el = document.getElementById(id); if (!el) return;
    var b = el.querySelectorAll('button');
    for (var j = 0; j < b.length; j++) {
      if (b[j].getAttribute('data-v') === st[klic]) b[j].className = 'on';
      b[j].onclick = function () {
        var v = this.getAttribute('data-v'), zmena = st[klic] !== v;
        st[klic] = v;
        if (st.tv !== 'atv') st.na = 'telefon';
        else if (zmena && klic === 'na') st.in = vychoziIn();   // jiný pomocník → výchozí cesta do TV
        uloz(); kresli();
      };
    }
  }
  function nahoru() { try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { window.scrollTo(0, 0); } }
  function uloz() { try { history.replaceState(null, '', location.pathname + location.search.replace(/[?&]lang=(cs|en)(?=&|$)/, '').replace(/^&/, '?') + '#tv=' + st.tv + '&na=' + st.na + '&ko=' + st.ko + '&dl=' + st.dl + '&in=' + st.in + '&k=' + st.k + '&p=' + st.p); } catch (e) {} }
  function nacti() {
    var h = (location.hash || '').slice(1).split('&'), maIn = false, maNa = false;
    for (var i = 0; i < h.length; i++) {
      var p = h[i].split('=');
      if (D.volby[p[0]] && D.volby[p[0]].indexOf(p[1]) >= 0) {
        st[p[0]] = p[1];
        if (p[0] === 'in') maIn = true;
        if (p[0] === 'na') maNa = true;
      }
      if (p[0] === 'k' && /^(-1|\d)$/.test(p[1]) && +p[1] < KROKY.length) st.k = +p[1];
      if (p[0] === 'p' && /^\d{1,2}$/.test(p[1])) st.p = +p[1];
    }
    // starý odkaz bez in (do 24. 11. 2026, např. #tv=atv&na=ovladac&k=0&p=2 z úvodní stránky): cesta do TV podle na
    if (maNa && !maIn) st.in = vychoziIn();
    normal();
    // deep-link na skrytou skupinu (sdílený odkaz z jiné volby TV/konzole) – posunout na nejbližší viditelnou
    if (st.k > 0 && st.k !== POSL && skryta(st.k)) {
      var k2 = st.k; while (k2 < POSL && skryta(k2)) k2++;
      if (k2 === POSL) { k2 = st.k; while (k2 > 0 && skryta(k2)) k2--; }
      st.k = k2; st.p = 0;
    }
  }
  document.getElementById('dal').onclick = function () {
    if (st.k < 0) { st.k = 0; st.p = 0; }
    else if (st.p < PODY[st.k].length - 1) st.p++;
    else if (st.k < POSL) {
      st.k++;
      while (st.k < POSL && skryta(st.k)) st.k++; // skupina bez vlastní akce pro tuhle volbu – přeskočit
      st.p = 0;
    }
    else { location.href = './'; return; }
    uloz(); kresli(); nahoru();
  };
  document.getElementById('zpet').onclick = function () {
    if (st.k < 0) return;
    if (st.k === 0 && st.p === 0) st.k = -1;
    else if (st.p > 0) st.p--;
    else if (st.k > 0) {
      st.k--;
      while (st.k > 0 && skryta(st.k)) st.k--;
      st.p = PODY[st.k].length - 1;
    }
    uloz(); kresli(); nahoru();
  };
  var jl = document.querySelectorAll('.jazyk a');
  for (var z = 0; z < jl.length; z++) jl[z].onclick = function () {
    J = this.getAttribute('data-lang');
    try { localStorage.setItem(KLIC, J); } catch (e) {}
    jazykStranky(); kresli(); uloz();
  };
  nacti(); jazykStranky(); kresli();
  window.addEventListener('hashchange', function () { nacti(); kresli(); nahoru(); });
  try {
    var x = new XMLHttpRequest(); x.open('GET', 'videa/kroky.json');
    x.onload = function () { try { var k = JSON.parse(x.responseText); DELKY = k.klipy || {}; JENCS = k.jen_cs || []; kresli(); } catch (e) {} }; x.send();
  } catch (e) {}
})();
</script>
