# ReCaption pro iPhone (zkušební, čtečka pro TV LG / Samsung) – přehled v ios/CTI-ME.md.
#
# Každý push, který mění ios/ nebo společnou logiku (core), ji přeloží pro iPhone (ios/jadro, testy z Androidu na macOS),
# sestaví knihovnu pro spojení s PS5 (ios/chiaki, chiaki-ng), aplikaci na Macu, pustí testy a vyzkouší ji v simulátoru:
# ios/zkouska/tv.mjs předstírá aplikaci v TV a čeká na zkušební větu (snímek obrazovky v artefaktu „snimky-ios“).
# Zdarma na 7 dní (Sideloadly, bez účtu Apple Developer): úloha ipa → vydání ios-zkusebni / ios.
# Do TestFlightu se nahrává z main a při ručním spuštění (Actions → ReCaption pro iPhone → Run workflow),
# jen když jsou v tajných údajích repozitáře údaje k účtu Apple (jinak se krok přeskočí s poznámkou):
#   APPLE_TEAM_ID  – Team ID z developer.apple.com → Membership
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 – klíč App Store Connect API (role Admin; P8 = obsah souboru .p8)
# Mac: macos-26 – 23. 11. 2026 macos-14 GitHub už nepodporoval („configuration … is not supported“)
# a úlohy na macos-15 i macos-latest 15 min čekaly ve frontě a pak se zrušily.
# Podpis (certifikát a profil) si Xcode s tím klíčem vyřídí sám u Applu, nic dalšího se neukládá.
name: ReCaption pro iPhone

# Jen ruční spuštění (přání majitele 24. 11. 2026): GitHub Mac většinou nedá (úloha 15 min ve frontě a pak chyba)
# a při každé verzi pro Android, která měnila společnou logiku, chodil majiteli e-mail „build failed“.
# Sestavuje se na Codemagicu (codemagic.yaml, ios/CTI-ME.md#codemagic); tady jen Actions → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zkouska:
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('ios/jadro/build.gradle.kts') }}

      - name: Knihovna pro PS5, společná logika a projekt pro Xcode
        working-directory: .
        run: ios/priprav.sh

      - name: Testy společné logiky (testy z Androidu na macOS)
        working-directory: .
        run: ./gradlew -p ios/jadro macosArm64Test --console=plain

      - name: Simulátor iPhonu
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          d = json.load(sys.stdin)["devices"]
          def ver(k):
              m = re.search(r"iOS-(\d+)-(\d+)", k)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          for k in sorted(d, key=ver, reverse=True):
              phones = [x for x in d[k] if "iOS" in k and x["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break
          ')
          echo "Simulátor: $UDID"
          test -n "$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Testy
        run: |
          xcodebuild test -project ReCaption.xcodeproj -scheme ReCaption \
            -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO | tail -n 40
          exit ${PIPESTATUS[0]}

      - name: Sestavení pro simulátor
        run: |
          xcodebuild build -project ReCaption.xcodeproj -scheme ReCaption -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tail -n 20
          exit ${PIPESTATUS[0]}

      - name: Zkouška se „TV“ – zkušební věta do TV
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/ReCaption.app
          xcrun simctl launch "$UDID" cz.recaption -zkouska
          node zkouska/tv.mjs ws://127.0.0.1:8787
          sleep 1
          mkdir -p snimky
          xcrun simctl io "$UDID" screenshot snimky/domu-pripojeno.png

      - name: Snímky
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snimky-ios
          path: ios/snimky
          if-no-files-found: ignore

  # Nepodepsaný balíček k nahrání zdarma (Sideloadly / SideStore s běžným Apple ID, platí 7 dní) – postup v ios/CTI-ME.md.
  # Vydání „ios-zkusebni“ (z větve) / „ios“ (z main); z větve, která mění .github/workflows, GitHub vydání nedovolí,
  # pak je balíček jen jako artefakt běhu „ReCaption-iPhone“.
  ipa:
    needs: zkouska
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('ios/jadro/build.gradle.kts') }}

      - name: Knihovna pro PS5, společná logika a projekt pro Xcode
        working-directory: .
        run: ios/priprav.sh

      - name: Sestavení pro iPhone bez podpisu
        run: |
          CISLO=$(( ${{ github.run_number }} * 10 + ${{ github.run_attempt }} ))
          xcodebuild build -project ReCaption.xcodeproj -scheme ReCaption -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build CURRENT_PROJECT_VERSION="$CISLO" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 20
          test ${PIPESTATUS[0]} -eq 0
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ReCaption.app Payload/
          zip -qry ReCaption-iPhone.ipa Payload
          ls -l ReCaption-iPhone.ipa
          VERZE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/ReCaption.app/Info.plist)
          echo "VERZE=$VERZE ($CISLO)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ReCaption-iPhone
          path: ios/ReCaption-iPhone.ipa
          compression-level: 0

      - name: Vydání „ios“ (z main) / „ios-zkusebni“ (z větve)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then ZNACKA=ios; NAZEV="ReCaption pro iPhone (zkušební) $VERZE"
          else ZNACKA=ios-zkusebni; NAZEV="ReCaption pro iPhone – zkušební z větve ${GITHUB_REF_NAME} ($VERZE)"; fi
          gh release delete "$ZNACKA" --yes --cleanup-tag || true
          gh release create "$ZNACKA" ReCaption-iPhone.ipa --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "$NAZEV" \
            --notes "ReCaption pro iPhone, zkušební: čtečka pro TV LG / Samsung. Nepodepsaný balíček k nahrání programem Sideloadly (nebo SideStore) s vlastním Apple ID – platí 7 dní, pak nahrát znovu. Postup: https://github.com/adusa89/ReCaption/blob/main/ios/CTI-ME.md#zdarma. Zdrojový kód je v tomto repozitáři (AGPL-3.0)."

  testflight:
    needs: zkouska
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5

      - name: Údaje k účtu Apple
        id: udaje
        run: |
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TestFlight přeskočen – chybí tajné údaje APPLE_TEAM_ID / ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 (viz ios/CTI-ME.md)."
          fi

      - uses: actions/setup-java@v5
        if: steps.udaje.outputs.ok == '1'
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Knihovna pro PS5, společná logika a projekt pro Xcode
        if: steps.udaje.outputs.ok == '1'
        working-directory: .
        run: ios/priprav.sh

      - name: Podepsat a nahrát do TestFlightu
        if: steps.udaje.outputs.ok == '1'
        run: |
          KLIC="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KLIC"
          trap 'rm -f "$KLIC"' EXIT
          CISLO=$(( ${{ github.run_number }} * 10 + ${{ github.run_attempt }} ))
          echo "Číslo sestavení: $CISLO"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KLIC"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive -project ReCaption.xcodeproj -scheme ReCaption -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/ReCaption.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$CISLO" \
            "${AUTH[@]}" | tail -n 30
          test ${PIPESTATUS[0]} -eq 0
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/ReCaption.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export "${AUTH[@]}" | tail -n 30
          test ${PIPESTATUS[0]} -eq 0
          echo "::notice::Sestavení $CISLO nahráno do App Store Connect – v TestFlightu bude asi za 10–30 min."
