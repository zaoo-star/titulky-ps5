# Titulky PS5 – sestavení a vydání (licence AGPL-3.0, viz LICENSE a README).
# Každý push: testy logiky + podepsané APK. Z větve main navíc vydání „latest“, odkud si appka bere aktualizace
# (version.txt + TitulkyPS5.apk / TitulkyPS5-arm64.apk / TitulkyPS5-arm32.apk – názvy čte Updater.kt).
# Podpis: tajné údaje repozitáře TPS5_KEY_BASE64 (p12 v base64, alias „recaption“) a TPS5_KEY_PASSWORD.
# Bez nich se nic nevydá (APK s dočasným podpisem by nešlo nainstalovat přes předchozí verzi).
name: Sestavit APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sestaveni-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Nástroje pro nativní část (spojení s PlayStationem)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler python3-protobuf ninja-build
          pip3 install --user --break-system-packages protobuf grpcio-tools || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" | tail -3

      - name: Klíč nativní části
        id: nat
        run: |
          VOLBY=$(sed -n '/externalNativeBuild {/,/^    }/p' app/build.gradle.kts | sha1sum | cut -c1-12)
          echo "klic=nativni-v1-$(git rev-parse HEAD:third_party/chiaki-ng)-${{ hashFiles('app/src/main/cpp/**') }}-$VOLBY" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: nativni
          key: ${{ steps.nat.outputs.klic }}
      - name: Nativní část z mezipaměti?
        run: |
          if [ -f nativni/arm64-v8a/libchiaki-jni.so ] && [ -f nativni/armeabi-v7a/libchiaki-jni.so ]; then
            echo "NATIVNI=-PnativniZ=$PWD/nativni" >> "$GITHUB_ENV"; echo "Nativní část z mezipaměti."
          else echo "Nativní část se přeloží."; fi

      - name: Testy logiky
        run: chmod +x gradlew && bash ci/opakuj-sit.sh ./gradlew testDebugUnitTest --no-daemon $NATIVNI

      - name: Sestavení APK (ARM)
        env:
          RECAPTION_KEY_BASE64: ${{ secrets.TPS5_KEY_BASE64 }}
          RECAPTION_KEY_PASSWORD: ${{ secrets.TPS5_KEY_PASSWORD }}
        run: |
          KLIC="$RUNNER_TEMP/tps5.p12"
          trap 'rm -f "$KLIC"' EXIT
          if [ -n "$RECAPTION_KEY_BASE64" ]; then
            printf '%s' "$RECAPTION_KEY_BASE64" | tr -d ' \r\n\t' | base64 -d > "$KLIC"
            export RECAPTION_KEY_FILE="$KLIC"
          fi
          bash ci/opakuj-sit.sh ./gradlew assembleRelease --no-daemon -Pkanal=latest -PabiApk $NATIVNI
          if [ -z "$NATIVNI" ]; then
            rm -rf nativni-tmp && unzip -q -o app/build/outputs/apk/release/app-universal-release.apk 'lib/*/libchiaki-jni.so' 'lib/*/libc++_shared.so' -d nativni-tmp
            rm -rf nativni && mv nativni-tmp/lib nativni && rm -rf nativni-tmp
          fi

      - name: Přejmenovat a zkontrolovat APK
        run: |
          cp app/build/outputs/apk/release/app-universal-release.apk TitulkyPS5.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk TitulkyPS5-arm64.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk TitulkyPS5-arm32.apk
          unzip -l TitulkyPS5.apk | grep -q "lib/arm64-v8a/libchiaki-jni.so"
          unzip -l TitulkyPS5.apk | grep -q "lib/armeabi-v7a/libchiaki-jni.so"
          unzip -l TitulkyPS5-arm64.apk | grep -q "lib/arm64-v8a/libchiaki-jni.so"
          unzip -l TitulkyPS5-arm32.apk | grep -q "lib/armeabi-v7a/libchiaki-jni.so"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging TitulkyPS5.apk | grep -E "^package:|^application-label:"
          "$AAPT" dump badging TitulkyPS5.apk | grep -q "package: name='cz.titulkyps5'"
          CODE=$("$AAPT" dump badging TitulkyPS5.apk | grep -oE "versionCode='[0-9]+'" | grep -oE "[0-9]+")
          NAME=$("$AAPT" dump badging TitulkyPS5.apk | grep -oE "versionName='[^']+'" | cut -d"'" -f2)
          echo "$CODE $NAME" > version.txt; cat version.txt
          ls -la TitulkyPS5*.apk

      - name: Kontrola podpisu
        env:
          MA_KLIC: ${{ secrets.TPS5_KEY_BASE64 != '' }}
        run: |
          otisk() { "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$1" | grep -m1 "SHA-256" | grep -oE "[0-9a-f]{64}" || true; }
          O=$(otisk TitulkyPS5.apk); echo "otisk podpisu: $O"
          for f in TitulkyPS5-arm64.apk TitulkyPS5-arm32.apk; do [ "$(otisk $f)" = "$O" ] || { echo "::error::APK mají různý podpis"; exit 1; }; done
          if [ "$MA_KLIC" = "true" ]; then echo "stálý" > podpis.txt; else echo "dočasný" > podpis.txt; echo "::warning::Chybí tajné údaje TPS5_KEY_BASE64 / TPS5_KEY_PASSWORD – APK má dočasný podpis a nevydá se."; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Titulky-PS5-APK
          path: |
            TitulkyPS5.apk
            TitulkyPS5-arm64.apk
            TitulkyPS5-arm32.apk
            version.txt
            podpis.txt

      - name: Vydat (latest)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat podpis.txt)" != "stálý" ]; then echo "Dočasný podpis – nevydávám."; exit 0; fi
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Titulky PS5 (nejnovější)" --notes "Titulky PS5 – české titulky do her z PS5 na Android TV. Licence AGPL-3.0, zdrojový kód je v tomto repozitáři."
          gh release upload latest TitulkyPS5.apk TitulkyPS5-arm64.apk TitulkyPS5-arm32.apk version.txt --clobber
          V=$(cut -d' ' -f2 version.txt)
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" TitulkyPS5.apk --title "Titulky PS5 $V" --notes "Verze $V (commit ${GITHUB_SHA::7})."
