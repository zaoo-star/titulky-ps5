# Web ze složky pomoc/ (Jekyll): hlavní adresa pro hráče je Cloudflare Pages https://recaption.pages.dev (úloha
# „cloudflare“), GitHub Pages https://adusa89.github.io/ReCaption/ je jen záložní kopie (úloha „stranky“).
# Nasazuje se jen z main. Pozor: commit s [skip ci] nasazení přeskočí – pak spustit ručně: gh workflow run pomoc.yml
name: Stránky s pomocí

on:
  push:
    branches: [main]
    paths: ["pomoc/**", "cloudflare/**", "ci/pruvodce-web.test.js", ".github/workflows/pomoc.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  stranky:
    runs-on: ubuntu-latest
    # jen záložní kopie (hlavní web je Cloudflare) – její chyba neoznačí běh za neúspěšný (žádný e-mail „failed“)
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.nasazeni.outputs.page_url || steps.nasazeni2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Kontrola průvodce (data ze šablony core/Pruvodce.kt)
        run: node ci/pruvodce-web.test.js
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./pomoc
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
      - run: sleep 20   # GitHub nahraný balík hned po nahrání často ještě nevidí
      # GitHub občas nahraný balík stránek hned po nahrání ještě nevidí („No artifacts named github-pages“, „Found 0
      # artifact(s)“ – 4 z 8 běhů 23.–24. 11. 2026): nasazení se po krátké pauze zopakuje (jde jen o záložní kopii,
      # hlavní web je Cloudflare níž).
      - id: nasazeni
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.nasazeni.outcome == 'failure'
        run: sleep 45
      - id: nasazeni2
        if: steps.nasazeni.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # Od 1.00-rc2 hlavní adresa pro hráče: Cloudflare Pages https://recaption.pages.dev (přání majitele – v odkazech nemá být
  # GitHub). Stejné stránky + cloudflare/_worker.js (stahování z vydání pod naší adresou: /d/<kanál>/<soubor>, /stahnout, /pc,
  # /mac). Nahrává se jen s tajnými údaji CLOUDFLARE_API_TOKEN a CLOUDFLARE_ACCOUNT_ID (účet majitele), jinak se jen složí
  # a uloží jako artefakt „cloudflare-stranky“ (nahrát pak ručně: npx wrangler pages deploy <složka> --project-name recaption).
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kontrola průvodce (data ze šablony core/Pruvodce.kt)
        run: node ci/pruvodce-web.test.js
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./pomoc
          destination: ./_cf
      - name: Stránky pro kořen adresy a program pro stahování
        run: |
          sudo chown -R "$(id -u)" _cf
          # GitHub Pages běží pod /ReCaption/, Cloudflare v kořeni – odkazy na styly a stránky bez té části
          find _cf -name '*.html' -print0 | xargs -0 sed -i -e 's#href="/ReCaption/#href="/#g' -e 's#src="/ReCaption/#src="/#g'
          cp cloudflare/_worker.js _cf/_worker.js
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-stranky
          path: _cf
          retention-days: 7
      - name: Nahrát na Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::Chybí CLOUDFLARE_API_TOKEN – stránky jsou jen v artefaktu cloudflare-stranky."; exit 0; fi
          VETEV=$([ "$GITHUB_REF_NAME" = "main" ] && echo main || echo "$GITHUB_REF_NAME" | tr -c 'a-z0-9-' '-' | cut -c1-28)
          # projekt „recaption“ (od 1.00-rc14) se při prvním nahrání založí sám; když už je, chyba se přeskočí
          npx -y wrangler@4 pages project create recaption --production-branch main >/dev/null 2>&1 || true
          npx -y wrangler@4 pages deploy _cf --project-name recaption --branch "$VETEV" --commit-dirty=true
