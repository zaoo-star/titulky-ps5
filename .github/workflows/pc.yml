# Titulky PS5 pro počítač s Windows jako balíček ke stažení (TitulkyPS5-PC.zip): rozbalit a spustit TitulkyPS5.exe.
# Nic se neinstaluje – Java i Python s knihovnami pro čtení a překlad jsou uvnitř; po prvním spuštění se jen
# stáhne překladový model (Domů → Připravit) a program Remote Play chiaki-ng (Domů → Stáhnout).
#
# Každý push, který mění pc/ nebo core (pc se z core překládá), složí balíček a vyzkouší ho:
#   - přibalený Python přečte a přeloží ukázkový titulek (pc/zkouska_balicku.py),
#   - okno aplikace se otevře a uloží snímky stránek (artefakt „snimky-pc“).
# Z větve je balíček jen jako artefakt běhu (záložka Actions); z main jde do vydání „pc“
# (https://github.com/zaoo-star/titulky-ps5/releases/download/pc/TitulkyPS5-PC.zip). Titulky PS5: PC jako čtečka pro Android TV
# s režimem „Překlad z PC“ (PcReceiverService).
name: Titulky PS5 pro PC

on:
  push:
    paths:
      - "pc/**"
      - "app/src/main/java/cz/recaption/core/**"
      - ".github/workflows/pc.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  balicek:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          # přesná verze, pro kterou má python.org vložený Python (embed) – novější opravy 3.12 ho už nemají
          python-version: "3.12.10"

      - name: Sestavit Titulky PS5 pro PC
        shell: pwsh
        run: .\gradlew.bat -p pc installDist --console=plain

      - name: Okno aplikace se vším (Java uvnitř)
        shell: pwsh
        run: |
          $verze = (Select-String -Path app\build.gradle.kts -Pattern 'versionName = "([0-9.]+)').Matches[0].Groups[1].Value
          "VERZE=$verze" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          jpackage --type app-image --name TitulkyPS5 --dest out `
            --input pc\build\install\recaption-pc\lib --main-jar recaption-pc.jar --main-class cz.recaption.pc.AplikaceKt `
            --java-options '-Drecaption.pc=$APPDIR' --java-options '-Dfile.encoding=UTF-8' `
            --app-version $verze --vendor "Titulky PS5" --description "Titulky PS5 pro PC"
          Copy-Item pc\cteni.py, pc\priprava.ps1, app\src\main\assets\hry-profily.json out\TitulkyPS5\app\

      - name: Python s knihovnami pro čtení a překlad
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $py = (python -c "import platform; print(platform.python_version())").Trim()
          $cil = "out\TitulkyPS5\app\python"
          Invoke-WebRequest "https://www.python.org/ftp/python/$py/python-$py-embed-amd64.zip" -OutFile embed.zip
          Expand-Archive embed.zip -DestinationPath $cil
          # vložený Python čte cesty jen ze souboru ._pth – přidat knihovny a import site
          $pth = Get-ChildItem "$cil\python3*._pth" | Select-Object -First 1
          $zip = Get-ChildItem "$cil\python3*.zip" | Select-Object -First 1
          Set-Content $pth.FullName "$($zip.Name)`n.`nLib\site-packages`nimport site" -Encoding ascii
          python -m pip install --only-binary=:all: --target "$cil\Lib\site-packages" -q `
            ctranslate2 subword-nmt sacremoses rapidocr-onnxruntime pillow numpy
          Get-ChildItem "$cil\Lib\site-packages" -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          "{0:N0} MB" -f ((Get-ChildItem out\TitulkyPS5 -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Zkouška – přibalený Python přečte a přeloží titulek
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = "1"
          powershell -NoProfile -ExecutionPolicy Bypass -File out\TitulkyPS5\app\priprava.ps1 -Jazyk cs -BezSestaveni -Python out\TitulkyPS5\app\python\python.exe
          $model = Get-ChildItem "$env:LOCALAPPDATA\TitulkyPS5\modely\en_cs" -Directory | Select-Object -First 1
          python pc\zkouska_balicku.py out\TitulkyPS5\app\python\python.exe out\TitulkyPS5\app\cteni.py $model.FullName

      - name: Zkouška – okno aplikace (snímky stránek)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force snimky | Out-Null
          $env:JAVA_TOOL_OPTIONS = "-Drecaption.snimek=$PWD\snimky"
          $p = Start-Process out\TitulkyPS5\TitulkyPS5.exe -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "okno se do 2 minut nezavřelo" }
          Get-ChildItem snimky

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snimky-pc
          path: snimky
          if-no-files-found: ignore

      - name: ZIP
        shell: pwsh
        run: Compress-Archive out\TitulkyPS5 TitulkyPS5-PC.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TitulkyPS5-PC
          path: TitulkyPS5-PC.zip
          compression-level: 0

      - name: Vydání „pc“ (jen z main)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pc --yes --cleanup-tag || true
          gh release create pc TitulkyPS5-PC.zip --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Titulky PS5 pro PC $VERZE" \
            --notes "Titulky PS5 pro počítač s Windows 10/11 (64 bit). Rozbalit ZIP a spustit TitulkyPS5.exe – nic se neinstaluje. Jako čtečka pro Titulky PS5 na Android TV: ⚙ → Použití → Čtečka pro TV, v TV Nastavení → Překlad z PC. Spojení s PlayStationem obstarává program chiaki-ng (AGPL-3.0), který si program stáhne sám; zdrojový kód je v tomto repozitáři (úprava open-source projektu, licence AGPL-3.0)."
